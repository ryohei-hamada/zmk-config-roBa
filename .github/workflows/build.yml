name: roBa right encoder MIDI candidate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  right:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
      - name: Host storage and power-cut tests
        run: python3 tests/runtime/run.py
      - name: Prepare pinned workspace
        run: |
          mkdir -p /tmp/roba-build/config
          cp -R config/* /tmp/roba-build/config/
          cd /tmp/roba-build
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
          git -C zmk apply --check "$GITHUB_WORKSPACE/patches/custom-rpc-v0.3.patch"
          git -C zmk apply "$GITHUB_WORKSPACE/patches/custom-rpc-v0.3.patch"
      - name: Build right controller only
        working-directory: /tmp/roba-build
        run: west build -s zmk/app -d build -b seeeduino_xiao_ble -S studio-rpc-usb-uart -- -DSHIELD=roBa_R -DZMK_CONFIG=/tmp/roba-build/config -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE"
      - name: Configuration evidence
        if: always()
        run: |
          if test -f /tmp/roba-build/build/zephyr/.config; then cat /tmp/roba-build/build/zephyr/.config; fi
          if test -f /tmp/roba-build/build/zephyr/zephyr.dts; then cat /tmp/roba-build/build/zephyr/zephyr.dts; fi
      - name: Prepare artifact
        run: |
          mkdir artifacts
          cp /tmp/roba-build/build/zephyr/zmk.uf2 artifacts/roBa_R-encoder-midi-0.6.0.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-encoder-midi-0.6.0-right
          path: artifacts/
